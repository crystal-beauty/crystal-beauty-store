<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded elegant background -->
  <rect width="100" height="100" rx="24" fill="#0A1F44" />
  
  <!-- Subtle inner glow border -->
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="white" stroke-opacity="0.12" stroke-width="2" />

  <!-- Crystal Gem Facets -->
  <g id="crystal-gem" transform="translate(15, 12)">
    <!-- Top facets -->
    <polygon points="35,6 20,24 50,24" fill="#FFFFFF" fill-opacity="0.95" />
    <polygon points="35,6 10,24 20,24" fill="#E2E8F0" fill-opacity="0.85" />
    <polygon points="35,6 50,24 60,24" fill="#CBD5E1" fill-opacity="0.75" />

    <!-- Center/Lower main facets -->
    <polygon points="20,24 50,24 35,68" fill="#FFFFFF" fill-opacity="0.9" />
    <polygon points="10,24 20,24 35,68" fill="#94A3B8" fill-opacity="0.7" />
    <polygon points="50,24 60,24 35,68" fill="#64748B" fill-opacity="0.65" />

    <!-- Facet outlines / highlights -->
    <path d="M35 6L10 24L35 68L60 24L35 6Z" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" />
    <line x1="35" y1="6" x2="20" y2="24" stroke="#FFFFFF" stroke-width="1.2" />
    <line x1="35" y1="6" x2="50" y2="24" stroke="#FFFFFF" stroke-width="1.2" />
    <line x1="10" y1="24" x2="60" y2="24" stroke="#FFFFFF" stroke-width="1.2" />
    <line x1="20" y1="24" x2="35" y2="68" stroke="#FFFFFF" stroke-width="1.2" />
    <line x1="50" y1="24" x2="35" y2="68" stroke="#FFFFFF" stroke-width="1.2" />

    <!-- Sparkle Stars -->
    <g transform="translate(56, 4) scale(0.7)">
      <path d="M10 0L12.5 7.5L20 10L12.5 12.5L10 20L7.5 12.5L0 10L7.5 7.5Z" fill="#F8FAFC" />
    </g>
    <g transform="translate(2, 42) scale(0.45)">
      <path d="M10 0L12.5 7.5L20 10L12.5 12.5L10 20L7.5 12.5L0 10L7.5 7.5Z" fill="#F8FAFC" />
    </g>
  </g>
</svg>
